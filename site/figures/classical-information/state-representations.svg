<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title description"><title id="title">One setting, two representations</title><desc id="description">Three switch settings are mapped to three-component one-hot vectors and fixed two-bit codes. The string 11 is unused.</desc><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#242424}.muted{fill:#666}.accent{fill:#286a9b}.rule{stroke:#d6d6d6;stroke-width:1}.flow{stroke:#555;stroke-width:2;fill:none}</style>
<text x="35" y="42" font-size="25" font-weight="bold" class="">One setting, two representations</text>
<text x="35" y="78" font-size="18" font-weight="normal" class="muted">Coordinate order: (off, low, high)</text>
<text x="35" y="126" font-size="19" font-weight="bold" class="">Switch setting</text>
<text x="325" y="126" font-size="19" font-weight="bold" class="">Basis column</text>
<text x="665" y="126" font-size="19" font-weight="bold" class="">Binary code</text>
<line x1="35" y1="145" x2="925" y2="145" class="rule"/>
<text x="35" y="188" font-size="20" font-weight="normal" class="">off</text>
<text x="325" y="188" font-size="20" font-weight="normal" class="">(1, 0, 0)ᵀ</text>
<text x="665" y="188" font-size="20" font-weight="normal" class="accent">00</text>
<line x1="35" y1="204" x2="925" y2="204" class="rule"/>
<text x="35" y="242" font-size="20" font-weight="normal" class="">low</text>
<text x="325" y="242" font-size="20" font-weight="normal" class="">(0, 1, 0)ᵀ</text>
<text x="665" y="242" font-size="20" font-weight="normal" class="accent">01</text>
<line x1="35" y1="258" x2="925" y2="258" class="rule"/>
<text x="35" y="296" font-size="20" font-weight="normal" class="">high</text>
<text x="325" y="296" font-size="20" font-weight="normal" class="">(0, 0, 1)ᵀ</text>
<text x="665" y="296" font-size="20" font-weight="normal" class="accent">10</text>
<line x1="35" y1="312" x2="925" y2="312" class="rule"/>
<text x="35" y="355" font-size="18" font-weight="normal" class="muted">Three basis coordinates; two storage bits. Binary string 11 is unused.</text>
</svg>
