<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc"><title id="title">Basis columns reconstruct a vector</title><desc id="desc">The vector with entries 2, 1, 3, 0 is the sum of 2 e_off, 1 e_low and 3 e_medium. This algebra example is not a probability distribution.</desc><rect width="1000" height="410" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#243746}.box{fill:#f7f9fb;stroke:#ccd5dc;stroke-width:1.5}.line{fill:none;stroke:#286a9b;stroke-width:2}.selected{fill:#e3eff8;stroke:#286a9b;stroke-width:2}</style>
<text x="30" y="40" font-size="26">Each basis column contributes to one coordinate</text>
<text x="35" y="100" font-size="20">2 × e_off</text>
<rect x="50" y="120" width="85" height="38" rx="5" class="selected"/>
<text x="85" y="147" font-size="22">2</text>
<rect x="50" y="163" width="85" height="38" rx="5" class="box"/>
<text x="85" y="190" font-size="22">0</text>
<rect x="50" y="206" width="85" height="38" rx="5" class="box"/>
<text x="85" y="233" font-size="22">0</text>
<rect x="50" y="249" width="85" height="38" rx="5" class="box"/>
<text x="85" y="276" font-size="22">0</text>
<text x="180" y="210" font-size="27">+</text>
<text x="230" y="100" font-size="20">1 × e_low</text>
<rect x="245" y="120" width="85" height="38" rx="5" class="box"/>
<text x="280" y="147" font-size="22">0</text>
<rect x="245" y="163" width="85" height="38" rx="5" class="selected"/>
<text x="280" y="190" font-size="22">1</text>
<rect x="245" y="206" width="85" height="38" rx="5" class="box"/>
<text x="280" y="233" font-size="22">0</text>
<rect x="245" y="249" width="85" height="38" rx="5" class="box"/>
<text x="280" y="276" font-size="22">0</text>
<text x="375" y="210" font-size="27">+</text>
<text x="425" y="100" font-size="20">3 × e_medium</text>
<rect x="440" y="120" width="85" height="38" rx="5" class="box"/>
<text x="475" y="147" font-size="22">0</text>
<rect x="440" y="163" width="85" height="38" rx="5" class="box"/>
<text x="475" y="190" font-size="22">0</text>
<rect x="440" y="206" width="85" height="38" rx="5" class="selected"/>
<text x="475" y="233" font-size="22">3</text>
<rect x="440" y="249" width="85" height="38" rx="5" class="box"/>
<text x="475" y="276" font-size="22">0</text>
<text x="570" y="210" font-size="27">+</text>
<text x="620" y="100" font-size="20">0 × e_high</text>
<rect x="635" y="120" width="85" height="38" rx="5" class="box"/>
<text x="670" y="147" font-size="22">0</text>
<rect x="635" y="163" width="85" height="38" rx="5" class="box"/>
<text x="670" y="190" font-size="22">0</text>
<rect x="635" y="206" width="85" height="38" rx="5" class="box"/>
<text x="670" y="233" font-size="22">0</text>
<rect x="635" y="249" width="85" height="38" rx="5" class="box"/>
<text x="670" y="276" font-size="22">0</text>
<text x="765" y="210" font-size="27">=</text>
<text x="815" y="100" font-size="20">v</text>
<rect x="830" y="120" width="85" height="38" rx="5" class="selected"/>
<text x="865" y="147" font-size="22">2</text>
<rect x="830" y="163" width="85" height="38" rx="5" class="selected"/>
<text x="865" y="190" font-size="22">1</text>
<rect x="830" y="206" width="85" height="38" rx="5" class="selected"/>
<text x="865" y="233" font-size="22">3</text>
<rect x="830" y="249" width="85" height="38" rx="5" class="box"/>
<text x="865" y="276" font-size="22">0</text>
<text x="30" y="340" font-size="19">Coordinate order: (off, low, medium, high). Add each row separately.</text>
<text x="30" y="380" font-size="18">This is a vector-algebra example; (2, 1, 3, 0) is not a probability distribution.</text>
</svg>
