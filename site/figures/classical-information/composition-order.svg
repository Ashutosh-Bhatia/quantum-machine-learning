<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title description"><title id="title">Operation order matters</title><desc id="description">An arbitrary bit distribution reset to zero and then flipped yields one. Flipping and then resetting yields zero. Temporal order A then B corresponds to product BA.</desc><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#242424}.muted{fill:#666}.accent{fill:#286a9b}.rule{stroke:#d6d6d6;stroke-width:1}.flow{stroke:#555;stroke-width:2;fill:none}</style>
<text x="35" y="42" font-size="25" font-weight="bold" class="">Operation order matters</text>
<text x="35" y="78" font-size="18" font-weight="normal" class="muted">The input is any normalized distribution p = (p₀, p₁)ᵀ.</text>
<rect x="35" y="113" width="145" height="56" fill="#fafafa" stroke="#ccc"/>
<text x="49" y="149" font-size="18" font-weight="normal" class="">Input p</text>
<rect x="225" y="113" width="150" height="56" fill="#fafafa" stroke="#ccc"/>
<text x="239" y="149" font-size="18" font-weight="normal" class="">Reset to 0</text>
<rect x="425" y="113" width="155" height="56" fill="#fafafa" stroke="#ccc"/>
<text x="439" y="149" font-size="18" font-weight="normal" class="">Flip</text>
<path d="M180 141 H217 M210 135 L218 141 L210 147" class="flow"/>
<path d="M375 141 H417 M410 135 L418 141 L410 147" class="flow"/>
<path d="M580 141 H627 M620 135 L628 141 L620 147" class="flow"/>
<text x="640" y="149" font-size="21" font-weight="bold" class="accent">(0, 1)ᵀ</text>
<text x="225" y="205" font-size="17" font-weight="normal" class="muted">After first: (1, 0)ᵀ</text>
<text x="640" y="205" font-size="20" font-weight="normal" class="">X R₀ = R₁</text>
<rect x="35" y="233" width="145" height="56" fill="#fafafa" stroke="#ccc"/>
<text x="49" y="269" font-size="18" font-weight="normal" class="">Input p</text>
<rect x="225" y="233" width="150" height="56" fill="#fafafa" stroke="#ccc"/>
<text x="239" y="269" font-size="18" font-weight="normal" class="">Flip</text>
<rect x="425" y="233" width="155" height="56" fill="#fafafa" stroke="#ccc"/>
<text x="439" y="269" font-size="18" font-weight="normal" class="">Reset to 0</text>
<path d="M180 261 H217 M210 255 L218 261 L210 267" class="flow"/>
<path d="M375 261 H417 M410 255 L418 261 L410 267" class="flow"/>
<path d="M580 261 H627 M620 255 L628 261 L620 267" class="flow"/>
<text x="640" y="269" font-size="21" font-weight="bold" class="accent">(1, 0)ᵀ</text>
<text x="225" y="325" font-size="17" font-weight="normal" class="muted">After first: (p₁, p₀)ᵀ</text>
<text x="640" y="325" font-size="20" font-weight="normal" class="">R₀ X = R₀</text>
<text x="35" y="365" font-size="17" font-weight="normal" class="muted">A then B acts as BA on a column vector. Regrouping is allowed; exchanging factors is not.</text>
</svg>
