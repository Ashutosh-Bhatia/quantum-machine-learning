<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d"><title id="t">Bell preparation circuit</title><desc id="d">The top A wire receives H and controls the X gate on B. This diagram labels A and B explicitly.</desc><rect width="1000" height="420" fill="white"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#286a9b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#243746}.box{fill:#f7f9fb;stroke:#c4cfd8}</style>
<text x="30" y="42" font-size="27">Prepare a Bell pair without an intermediate measurement</text>
<text x="30" y="148" font-size="26">A: |0⟩</text>
<path d="M150 140H900" stroke="#888" stroke-width="2"/>
<text x="30" y="258" font-size="26">B: |0⟩</text>
<path d="M150 250H900" stroke="#888" stroke-width="2"/>
<rect x="260" y="105" width="80" height="70" rx="5" class="box"/>
<text x="285" y="150" font-size="29">H</text>
<path d="M610 140V250" stroke="#286a9b" stroke-width="3"/><circle cx="610" cy="140" r="7" fill="#286a9b"/><circle cx="610" cy="250" r="22" fill="white" stroke="#286a9b" stroke-width="3"/><path d="M588 250H632M610 228V272" stroke="#286a9b" stroke-width="2"/>
<text x="170" y="325" font-size="23">After H: (|00⟩+|10⟩)/√2</text>
<text x="590" y="325" font-size="23">After CX: (|00⟩+|11⟩)/√2</text>
<text x="30" y="395" font-size="23">Time runs left to right. Notebook: H on q1, then cx(1,0).</text>
</svg>
