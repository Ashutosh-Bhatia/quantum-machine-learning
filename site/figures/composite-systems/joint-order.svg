<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d"><title id="t">Joint basis order</title><desc id="d">Rows group the A value and columns show the B value.</desc><rect width="1000" height="380" fill="white"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#286a9b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#243746}.box{fill:#f7f9fb;stroke:#c4cfd8}</style>
<text x="30" y="42" font-size="28">A on the left, B on the right: |AB⟩</text>
<rect x="35" y="95" width="210" height="165" rx="5" class="box"/>
<text x="100" y="145" font-size="30">|00⟩</text>
<text x="60" y="195" font-size="21">column entry 0</text>
<text x="60" y="230" font-size="22">amplitude a</text>
<rect x="275" y="95" width="210" height="165" rx="5" class="box"/>
<text x="340" y="145" font-size="30">|01⟩</text>
<text x="300" y="195" font-size="21">column entry 1</text>
<text x="300" y="230" font-size="22">amplitude b</text>
<rect x="515" y="95" width="210" height="165" rx="5" class="box"/>
<text x="580" y="145" font-size="30">|10⟩</text>
<text x="540" y="195" font-size="21">column entry 2</text>
<text x="540" y="230" font-size="22">amplitude c</text>
<rect x="755" y="95" width="210" height="165" rx="5" class="box"/>
<text x="820" y="145" font-size="30">|11⟩</text>
<text x="780" y="195" font-size="21">column entry 3</text>
<text x="780" y="230" font-size="22">amplitude d</text>
<text x="35" y="310" font-size="24">A=0: entries 0 and 1.       B=0: entries 0 and 2.</text>
<text x="35" y="355" font-size="21">Notebook mapping: A=q1, B=q0. Ket order and top-to-bottom wire order differ.</text>
