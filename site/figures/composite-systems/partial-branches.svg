<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="t d"><title id="t">Conditional branches</title><desc id="d">A measured value labels a normalized conditional B state with a branch probability.</desc><rect width="1000" height="410" fill="white"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#286a9b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#243746}.box{fill:#f7f9fb;stroke:#c4cfd8}</style>
<text x="30" y="42" font-size="26">Measure A; keep probability and conditional state separate</text>
<rect x="30" y="135" width="290" height="100" rx="5" class="box"/>
<text x="45" y="175" font-size="23">Input (1, i, 1, 0)ᵀ/√3</text>
<text x="45" y="210" font-size="23">Measure A in Z</text>
<path d="M325 185L470 130" fill="none" stroke="#286a9b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="480" y="85" width="475" height="100" rx="5" class="box"/>
<text x="500" y="122" font-size="25">A=0, probability 2/3</text>
<text x="500" y="160" font-size="24">B: (|0⟩ + i|1⟩)/√2</text>
<path d="M325 185L470 280" fill="none" stroke="#286a9b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="480" y="235" width="475" height="100" rx="5" class="box"/>
<text x="500" y="272" font-size="25">A=1, probability 1/3</text>
<text x="500" y="310" font-size="24">B: |0⟩</text>
<text x="30" y="390" font-size="24">Ignore A’s record: PB(0) = (2/3)(1/2) + (1/3)(1) = 2/3.</text>
</svg>
