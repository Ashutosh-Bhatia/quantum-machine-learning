<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d"><title id="t">Product or entangled</title><desc id="d">The determinant of the coefficient matrix tests a normalized pure two-qubit state.</desc><rect width="1000" height="380" fill="white"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#286a9b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#243746}.box{fill:#f7f9fb;stroke:#c4cfd8}</style>
<text x="30" y="42" font-size="28">A pure-state factorization test</text>
<rect x="35" y="90" width="430" height="225" rx="5" class="box"/>
<text x="60" y="130" font-size="26">Plus ⊗ plus</text>
<text x="125" y="185" font-size="25">1/2       1/2</text>
<text x="125" y="230" font-size="25">1/2       1/2</text>
<text x="60" y="287" font-size="23">ad − bc = 0: product</text>
<rect x="535" y="90" width="430" height="225" rx="5" class="box"/>
<text x="560" y="130" font-size="26">Bell Φ-positive</text>
<text x="625" y="185" font-size="25">1/√2       0</text>
<text x="625" y="230" font-size="25">0          1/√2</text>
<text x="560" y="287" font-size="23">ad − bc = 1/2: entangled</text>
<text x="35" y="355" font-size="21">This criterion applies to a specified pure-state column, not to a measured histogram.</text>
</svg>
