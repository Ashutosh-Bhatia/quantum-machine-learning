<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d"><title id="t">Readout basis conversion</title><desc id="d">X readout uses H then Z. Y readout uses S adjoint then H then Z.</desc><rect width="1000" height="380" fill="white"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#286a9b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#243746}.box{fill:#f7f9fb;stroke:#c4cfd8}</style>
<text x="30" y="42" font-size="28">Rotate the input basis into the detector basis</text>
<text x="30" y="140" font-size="24">X readout</text>
<rect x="225" y="100" width="170" height="75" rx="5" class="box"/>
<text x="240" y="145" font-size="24">H</text>
<path d="M400 137L430 137" fill="none" stroke="#286a9b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="440" y="100" width="170" height="75" rx="5" class="box"/>
<text x="455" y="145" font-size="24">measure Z</text>
<path d="M615 137L645 137" fill="none" stroke="#286a9b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="30" y="265" font-size="24">Y readout</text>
<rect x="225" y="225" width="170" height="75" rx="5" class="box"/>
<text x="240" y="270" font-size="24">S†</text>
<path d="M400 262L430 262" fill="none" stroke="#286a9b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="440" y="225" width="170" height="75" rx="5" class="box"/>
<text x="455" y="270" font-size="24">H</text>
<path d="M615 262L645 262" fill="none" stroke="#286a9b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="655" y="225" width="170" height="75" rx="5" class="box"/>
<text x="670" y="270" font-size="24">measure Z</text>
<path d="M830 262L860 262" fill="none" stroke="#286a9b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="30" y="355" font-size="21">Record 0: positive basis state. Record 1: negative basis state. Time runs left to right.</text>
</svg>
