<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 435" role="img" aria-labelledby="title desc"><title id="title">A computational abstraction</title><desc id="desc">Applications use algorithms and circuits, which are translated by software into control instructions for hardware. The reader begins with states, gates and measurement rather than device engineering.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#286a9b"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#242424}.guide{fill:none;stroke:#ccd3da;stroke-width:1.4}.flow{fill:none;stroke:#286a9b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="30" y="42" font-size="26" font-weight="bold" style="fill:#242424">Where do we work in the computing stack?</text>
<rect x="40" y="100" width="550" height="85" fill="#fafbfc" stroke="#c8cfd5"/>
<text x="56" y="130" font-size="20" font-weight="bold" style="fill:#242424">Learning task</text>
<text x="56" y="164" font-size="17" font-weight="normal" style="fill:#242424">Data, prediction, loss and evaluation</text>
<rect x="40" y="200" width="550" height="85" fill="#fafbfc" stroke="#c8cfd5"/>
<text x="56" y="230" font-size="20" font-weight="bold" style="fill:#242424">Computational model</text>
<text x="56" y="264" font-size="17" font-weight="normal" style="fill:#242424">States, gates, circuits and measurement</text>
<rect x="40" y="300" width="550" height="85" fill="#fafbfc" stroke="#c8cfd5"/>
<text x="56" y="330" font-size="20" font-weight="bold" style="fill:#242424">Physical implementation</text>
<text x="56" y="364" font-size="17" font-weight="normal" style="fill:#242424">Control signals and a quantum device</text>
<path d="M315 185L315 194" class="flow"/>
<path d="M315 285L315 294" class="flow"/>
<text x="650" y="140" font-size="21" font-weight="bold" style="fill:#286a9b">Our starting point</text>
<text x="650" y="180" font-size="19" font-weight="normal" style="fill:#242424">Understand the behavior</text>
<text x="650" y="208" font-size="19" font-weight="normal" style="fill:#242424">of states and operations.</text>
<text x="650" y="236" font-size="19" font-weight="normal" style="fill:#242424"></text>
<text x="650" y="264" font-size="19" font-weight="normal" style="fill:#242424">Develop the mathematics</text>
<text x="650" y="292" font-size="19" font-weight="normal" style="fill:#242424">needed to reason about it.</text>
<text x="40" y="418" font-size="17" font-weight="normal" style="fill:#666">Abstraction makes a complex system usable; hardware constraints still matter.</text>
</svg>
