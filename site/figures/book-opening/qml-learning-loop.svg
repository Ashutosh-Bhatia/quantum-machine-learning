<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc"><title id="title">A quantum model inside a learning loop</title><desc id="desc">Classical data are encoded in a quantum state. A parameterized circuit is measured to estimate a prediction. A classical loss and optimizer update the circuit parameters. This diagram does not claim a speedup.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#286a9b"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#242424}.guide{fill:none;stroke:#ccd3da;stroke-width:1.4}.flow{fill:none;stroke:#286a9b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="30" y="40" font-size="26" font-weight="bold" style="fill:#242424">A quantum model inside a learning loop</text>
<text x="30" y="75" font-size="18" font-weight="normal" style="fill:#666">One experiment can combine classical processing and quantum circuits.</text>
<rect x="30" y="125" width="290" height="115" fill="#fafbfc" stroke="#c8cfd5"/>
<text x="46" y="155" font-size="20" font-weight="bold" style="fill:#242424">Data and encoding</text>
<text x="46" y="189" font-size="17" font-weight="normal" style="fill:#242424">Choose x</text>
<text x="46" y="215" font-size="17" font-weight="normal" style="fill:#242424">Prepare a state</text>
<rect x="365" y="125" width="290" height="115" fill="#fafbfc" stroke="#c8cfd5"/>
<text x="381" y="155" font-size="20" font-weight="bold" style="fill:#242424">Circuit U(θ)</text>
<text x="381" y="189" font-size="17" font-weight="normal" style="fill:#242424">Apply gates</text>
<text x="381" y="215" font-size="17" font-weight="normal" style="fill:#242424">Parameters θ</text>
<rect x="700" y="125" width="290" height="115" fill="#fafbfc" stroke="#c8cfd5"/>
<text x="716" y="155" font-size="20" font-weight="bold" style="fill:#242424">Readout</text>
<text x="716" y="189" font-size="17" font-weight="normal" style="fill:#242424">Repeat preparations</text>
<text x="716" y="215" font-size="17" font-weight="normal" style="fill:#242424">Estimate prediction</text>
<path d="M320 183L356 183" class="flow"/>
<path d="M655 183L691 183" class="flow"/>
<rect x="700" y="310" width="290" height="100" fill="#fafbfc" stroke="#c8cfd5"/>
<text x="716" y="340" font-size="20" font-weight="bold" style="fill:#242424">Loss L(θ)</text>
<text x="716" y="374" font-size="17" font-weight="normal" style="fill:#242424">Compare with target</text>
<rect x="365" y="310" width="290" height="100" fill="#fafbfc" stroke="#c8cfd5"/>
<text x="381" y="340" font-size="20" font-weight="bold" style="fill:#242424">Classical optimizer</text>
<text x="381" y="374" font-size="17" font-weight="normal" style="fill:#242424">Estimate an update to θ</text>
<path d="M845 240L845 301" class="flow"/>
<path d="M700 360L664 360" class="flow"/>
<path d="M365 360H330V285H510V248" class="flow"/>
<text x="30" y="330" font-size="18" font-weight="bold" style="fill:#242424">Classical information</text>
<text x="30" y="360" font-size="17" font-weight="normal" style="fill:#242424">Data, targets, predictions,</text>
<text x="30" y="386" font-size="17" font-weight="normal" style="fill:#242424">loss and parameter updates</text>
<text x="30" y="465" font-size="18" font-weight="normal" style="fill:#666">The quantum component must be evaluated within the whole learning task.</text>
</svg>
