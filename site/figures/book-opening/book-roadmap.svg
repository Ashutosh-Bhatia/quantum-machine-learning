<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 385" role="img" aria-labelledby="title desc"><title id="title">The route through the book</title><desc id="desc">Part A builds quantum computing foundations, Part B connects classical machine learning, and Part C develops quantum models and evaluation.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#286a9b"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#242424}.guide{fill:none;stroke:#ccd3da;stroke-width:1.4}.flow{fill:none;stroke:#286a9b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="30" y="42" font-size="26" font-weight="bold" style="fill:#242424">The destination is quantum machine learning</text>
<text x="30" y="82" font-size="18" font-weight="normal" style="fill:#666">Each part supplies tools used in the next.</text>
<rect x="30" y="130" width="290" height="150" fill="#fafbfc" stroke="#c8cfd5"/>
<text x="46" y="160" font-size="20" font-weight="bold" style="fill:#242424">Part A</text>
<text x="46" y="194" font-size="17" font-weight="normal" style="fill:#242424">Quantum computing</text>
<text x="46" y="220" font-size="17" font-weight="normal" style="fill:#242424">States · gates · measurement</text>
<rect x="375" y="130" width="290" height="150" fill="#fafbfc" stroke="#c8cfd5"/>
<text x="391" y="160" font-size="20" font-weight="bold" style="fill:#242424">Part B</text>
<text x="391" y="194" font-size="17" font-weight="normal" style="fill:#242424">Classical ML bridge</text>
<text x="391" y="220" font-size="17" font-weight="normal" style="fill:#242424">Models · optimization · kernels</text>
<rect x="720" y="130" width="290" height="150" fill="#fafbfc" stroke="#c8cfd5"/>
<text x="736" y="160" font-size="20" font-weight="bold" style="fill:#242424">Part C</text>
<text x="736" y="194" font-size="17" font-weight="normal" style="fill:#242424">Quantum machine learning</text>
<text x="736" y="220" font-size="17" font-weight="normal" style="fill:#242424">Encoding · training · evaluation</text>
<path d="M320 205L366 205" class="flow"/>
<path d="M665 205L711 205" class="flow"/>
<text x="30" y="340" font-size="18" font-weight="normal" style="fill:#666">Throughout: theory, worked examples, academic figures, experiments and reflection.</text>
