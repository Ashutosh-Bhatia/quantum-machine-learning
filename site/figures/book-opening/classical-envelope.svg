<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 365" role="img" aria-labelledby="title desc"><title id="title">Opening an envelope updates information</title><desc id="desc">Before opening a recorded result, pass and fail have probabilities 3/4 and 1/4. Observing fail updates the description to probability one on fail without requiring a change to the printed result.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#286a9b"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#242424}.guide{fill:none;stroke:#ccd3da;stroke-width:1.4}.flow{fill:none;stroke:#286a9b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="30" y="42" font-size="25" font-weight="bold" style="fill:#242424">Learning a classical result changes our description</text>
<rect x="70" y="105" width="210" height="125" fill="white" stroke="#444" stroke-width="2"/><path d="M70 105L175 180L280 105 M70 230L145 166 M280 230L205 166" fill="none" stroke="#666" stroke-width="1.6"/>
<text x="90" y="265" font-size="20" font-weight="bold" style="fill:#242424">Sealed result</text>
<text x="340" y="130" font-size="21" font-weight="bold" style="fill:#242424">Before reading</text>
<text x="340" y="170" font-size="20" font-weight="normal" style="fill:#242424">P(pass) = 3/4</text>
<text x="340" y="199" font-size="20" font-weight="normal" style="fill:#242424">P(fail) = 1/4</text>
<path d="M570 170L655 170" class="flow"/>
<text x="590" y="145" font-size="17" font-weight="normal" style="fill:#242424">Read</text>
<text x="700" y="130" font-size="21" font-weight="bold" style="fill:#286a9b">Observed: fail</text>
<text x="700" y="170" font-size="20" font-weight="normal" style="fill:#242424">Updated P(pass) = 0</text>
<text x="700" y="199" font-size="20" font-weight="normal" style="fill:#242424">Updated P(fail) = 1</text>
<text x="30" y="330" font-size="18" font-weight="normal" style="fill:#666">The record can remain unchanged. The probability column describes our information.</text>
</svg>
