<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img"><style>text{font-family:Arial,sans-serif;fill:#17344d;font-size:20px}.small{font-size:17px}.box{fill:#f6f9fc;stroke:#567a96;stroke-width:2}.line{fill:none;stroke:#567a96;stroke-width:2}</style><rect width="1000" height="350" fill="white"/><title>Questions on the path to useful quantum computing</title><text x="500" y="40" text-anchor="middle">From computational possibility to useful performance</text><rect class="box" x="25" y="105" width="215" height="130" rx="8"/><text x="132" y="150" text-anchor="middle">Ideal algorithms</text><text class="small" x="132" y="195" text-anchor="middle">What can the model do?</text><path class="line" d="M240 170h30m-8 -6l8 6l-8 6"/><rect class="box" x="270" y="105" width="215" height="130" rx="8"/><text x="377" y="150" text-anchor="middle">Reliable computation</text><text class="small" x="377" y="195" text-anchor="middle">How do we control errors?</text><path class="line" d="M485 170h30m-8 -6l8 6l-8 6"/><rect class="box" x="515" y="105" width="215" height="130" rx="8"/><text x="622" y="150" text-anchor="middle">Physical experiments</text><text class="small" x="622" y="195" text-anchor="middle">What can devices show?</text><path class="line" d="M730 170h30m-8 -6l8 6l-8 6"/><rect class="box" x="760" y="105" width="215" height="130" rx="8"/><text x="867" y="150" text-anchor="middle">Useful systems</text><text class="small" x="867" y="195" text-anchor="middle">What is the complete cost?</text><text x="500" y="295" text-anchor="middle">Overlapping research questions, not a fixed sequence of completed eras.</text></svg>