<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc"><title id="title">Matching one-basis correlations is not enough</title><desc id="desc">A Bell state and an equal classical mixture of 00 and 11 both have matching Z outcomes. Their X-basis correlations differ. The comparison requires measurement choices and ordinary communication to compare records.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#286a9b"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#242424}.guide{fill:none;stroke:#ccd3da;stroke-width:1.4}.flow{fill:none;stroke:#286a9b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="30" y="42" font-size="26" font-weight="bold" style="fill:#242424">One matching correlation is not the whole state</text>
<rect x="35" y="95" width="455" height="110" fill="#fafbfc" stroke="#c8cfd5"/>
<text x="51" y="125" font-size="20" font-weight="bold" style="fill:#242424">Coherent Bell state</text>
<text x="51" y="159" font-size="17" font-weight="normal" style="fill:#242424">(|00⟩ + |11⟩) / √2</text>
<rect x="545" y="95" width="455" height="110" fill="#fafbfc" stroke="#c8cfd5"/>
<text x="561" y="125" font-size="20" font-weight="bold" style="fill:#242424">Classical mixture</text>
<text x="561" y="159" font-size="17" font-weight="normal" style="fill:#242424">Prepare 00 or 11 with equal probability</text>
<text x="35" y="252" font-size="19" font-weight="bold" style="fill:#242424">Measure both in Z</text>
<text x="550" y="252" font-size="19" font-weight="bold" style="fill:#242424">Measure both in X</text>
<text x="35" y="290" font-size="18" font-weight="normal" style="fill:#242424">Bell: matching outcomes with probability 1</text>
<text x="35" y="317" font-size="18" font-weight="normal" style="fill:#242424">Mixture: matching outcomes with probability 1</text>
<text x="550" y="290" font-size="18" font-weight="normal" style="fill:#242424">Bell: matching outcomes with probability 1</text>
<text x="550" y="317" font-size="18" font-weight="normal" style="fill:#242424">Mixture: matching outcomes with probability 1/2</text>
<text x="35" y="385" font-size="18" font-weight="normal" style="fill:#666">Same Z statistics do not prove entanglement. Basis choices reveal more.</text>
<text x="35" y="414" font-size="18" font-weight="normal" style="fill:#666">Correlations do not provide a controllable faster-than-light message.</text>
</svg>
