<text x="560" y="155" font-size="22" font-weight="bold" style="fill:#242424">Angles and measurement</text>
<text x="560" y="200" font-size="22" font-weight="normal" style="fill:#242424">|ψ⟩ = cos(θ/2)|0⟩</text>
<text x="575" y="231" font-size="22">+ e<tspan baseline-shift="super" font-size="15">iφ</tspan> sin(θ/2)|1⟩</text>
<text x="560" y="285" font-size="21" font-weight="normal" style="fill:#242424">P(0) = cos²(θ/2)</text>
