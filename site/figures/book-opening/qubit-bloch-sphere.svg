<text x="560" y="380" font-size="18" font-weight="normal" style="fill:#666">Pure states lie on the surface.</text>
<text x="560" y="407" font-size="18" font-weight="normal" style="fill:#666">Global phase is omitted.</text>
<text x="560" y="434" font-size="18" font-weight="normal" style="fill:#666">Shown: θ = 60°, φ = 60°.</text>
<text x="30" y="505" font-size="18" font-weight="normal" style="fill:#666">A projected geometric view. The accompanying equations define the probabilities.</text>
