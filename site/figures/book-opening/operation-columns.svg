<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" role="img" aria-labelledby="title desc"><title id="title">Build the asymmetric operation column by column</title><desc id="desc">Input zero maps to output zero with certainty. Input one maps to zero or one equally. These output distributions become the two columns of A.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#286a9b"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#242424}.guide{fill:none;stroke:#ccd3da;stroke-width:1.4}.flow{fill:none;stroke:#286a9b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="30" y="42" font-size="26" font-weight="bold" style="fill:#242424">Build an operation from each definite input</text>
<text x="40" y="105" font-size="21" font-weight="bold" style="fill:#242424">Input 0</text>
<text x="40" y="245" font-size="21" font-weight="bold" style="fill:#242424">Input 1</text>
<path d="M145 103L295 103" class="flow"/>
<text x="190" y="88" font-size="18" font-weight="normal" style="fill:#242424">1</text>
<text x="305" y="110" font-size="18" font-weight="normal" style="fill:#242424">0</text>
<text x="350" y="110" font-size="21" font-weight="normal" style="fill:#242424">Output distribution (1, 0)ᵀ</text>
<path d="M145 240L295 208" class="flow"/>
<text x="190" y="202" font-size="18" font-weight="normal" style="fill:#242424">1/2</text>
<path d="M145 240L295 277" class="flow"/>
<text x="190" y="282" font-size="18" font-weight="normal" style="fill:#242424">1/2</text>
<text x="305" y="214" font-size="18" font-weight="normal" style="fill:#242424">0</text>
<text x="305" y="285" font-size="18" font-weight="normal" style="fill:#242424">1</text>
<text x="350" y="245" font-size="21" font-weight="normal" style="fill:#242424">Output distribution (1/2, 1/2)ᵀ</text>
<text x="720" y="110" font-size="18" font-weight="bold" style="fill:#242424">Input columns:  0       1</text>
<text x="730" y="175" font-size="22" font-weight="normal" style="fill:#242424">A  =</text>
<path d="M810 131H800V235H810 M930 131H940V235H930" fill="none" stroke="#444" stroke-width="2"/>
<text x="820" y="166" font-size="24" font-weight="normal" style="fill:#242424">1</text>
<text x="895" y="166" font-size="24" font-weight="normal" style="fill:#242424">1/2</text>
<text x="820" y="217" font-size="24" font-weight="normal" style="fill:#242424">0</text>
<text x="895" y="217" font-size="24" font-weight="normal" style="fill:#242424">1/2</text>
<text x="720" y="282" font-size="18" font-weight="normal" style="fill:#242424">Each column sums to one.</text>
<text x="30" y="370" font-size="18" font-weight="normal" style="fill:#666">The input label chooses a column. An uncertain input combines columns with its weights.</text>
</svg>
