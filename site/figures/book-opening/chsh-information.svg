<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img"><style>text{font-family:Arial,sans-serif;fill:#17344d;font-size:20px}.small{font-size:17px}.box{fill:#f6f9fc;stroke:#567a96;stroke-width:2}.line{fill:none;stroke:#567a96;stroke-width:2}</style><rect width="1000" height="350" fill="white"/><title>CHSH information flow</title><text x="500" y="35" text-anchor="middle">CHSH: private inputs, local answers, joint comparison</text><rect class="box" x="380" y="60" width="240" height="60" rx="8"/><text x="500" y="98" text-anchor="middle">Referee: choose x, y</text><path class="line" d="M400 120L230 170M600 120L770 170"/><text x="275" y="137">x only</text><text x="660" y="137">y only</text><rect class="box" x="100" y="170" width="260" height="65" rx="8"/><rect class="box" x="640" y="170" width="260" height="65" rx="8"/><text x="230" y="210" text-anchor="middle">Alice: a = local output</text><text x="770" y="210" text-anchor="middle">Bob: b = local output</text><text x="500" y="185" text-anchor="middle" class="small">Shared Bell pair</text><text x="500" y="215" text-anchor="middle" class="small">No messages during round</text><path class="line" d="M230 235L380 280M770 235L620 280"/><text x="310" y="270">a</text><text x="680" y="270">b</text><rect class="box" x="310" y="280" width="380" height="50" rx="8"/><text x="500" y="313" text-anchor="middle">Referee checks: a XOR b = x AND y</text></svg>