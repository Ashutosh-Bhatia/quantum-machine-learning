<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="t d"><title id="t">Branches and preparation procedures</title><desc id="d">A branch is normalized only after its probability is computed. Fresh preparation and repeated readout are different procedures.</desc><rect width="1000" height="460" fill="white"/><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#286a9b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#243746}.line{fill:none;stroke:#286a9b;stroke-width:2;marker-end:url(#a)}.guide{fill:none;stroke:#c3cbd2;stroke-width:1.5}.box{fill:#f7f9fb;stroke:#c4cfd8}</style>
<text x="30" y="40" font-size="25">Separate the branch, its probability and its conditional state</text>
<rect x="30" y="85" width="260" height="105" rx="5" class="box"/>
<text x="44" y="120" font-size="21">Projected branch</text>
<text x="44" y="163" font-size="19">P₀ψ = (1/2, 0)ᵀ</text>
<rect x="370" y="85" width="260" height="105" rx="5" class="box"/>
<text x="384" y="120" font-size="21">Squared norm</text>
<text x="384" y="163" font-size="19">p₀ = 1/4</text>
<rect x="710" y="85" width="260" height="105" rx="5" class="box"/>
<text x="724" y="120" font-size="21">Conditional state</text>
<text x="724" y="163" font-size="19">P₀ψ / √p₀ = (1, 0)ᵀ</text>
<path d="M295 139L360 139" class="line"/>
<path d="M635 139L700 139" class="line"/>
<text x="35" y="240" font-size="21">Fresh trials:</text>
<text x="35" y="280" font-size="20">prepare ψ → measure → record; prepare ψ again → measure → record</text>
<text x="35" y="335" font-size="21">Retain the system:</text>
<text x="35" y="375" font-size="20">prepare ψ → measure → conditional state → same-basis measurement</text>
<text x="35" y="430" font-size="18">The second procedure repeats the outcome only under the stated ideal assumptions.</text>
</svg>
