<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d"><title id="t">Real vector projection</title><desc id="d">Vector v equals its projection onto unit u plus an orthogonal residual.</desc><rect width="1000" height="380" fill="white"/><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#286a9b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#243746}.line{fill:none;stroke:#286a9b;stroke-width:2;marker-end:url(#a)}.guide{fill:none;stroke:#b4bfc8;stroke-width:1.5;stroke-dasharray:5 4}.box{fill:#f7f9fb;stroke:#c4cfd8}</style>
<text x="30" y="38" font-size="26">Projection onto a unit direction</text>
<path d="M90 290L450 290" class="line"/>
<path d="M90 290L360 90" class="line"/>
<path d="M360 90L360 290" class="guide"/>
<text x="452" y="295" font-size="20">û</text>
<text x="370" y="90" font-size="20">v</text>
<text x="190" y="320" font-size="20">(û · v) û</text>
<text x="375" y="200" font-size="18">residual</text>
<text x="120" y="275" font-size="20">θ</text>
<rect x="575" y="100" width="380" height="210" rx="5" class="box"/>
<text x="590" y="140" font-size="19">Signed component: û · v</text>
<text x="590" y="183" font-size="19">Vector projection: (û · v) û</text>
<text x="590" y="226" font-size="19">Residual is perpendicular to û.</text>
<text x="590" y="269" font-size="19">For non-unit u, divide by u · u.</text>
</svg>
