<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d"><title id="t">A shear changes basis directions</title><desc id="d">A maps e0 to (1,0) and e1 to (2,1); the second basis direction tilts.</desc><rect width="1000" height="380" fill="white"/><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#286a9b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#243746}.line{fill:none;stroke:#286a9b;stroke-width:2;marker-end:url(#a)}.guide{fill:none;stroke:#b4bfc8;stroke-width:1.5;stroke-dasharray:5 4}.box{fill:#f7f9fb;stroke:#c4cfd8}</style>
<text x="30" y="38" font-size="26">A matrix stores the transformed basis columns</text>
<text x="80" y="90" font-size="22">Before</text>
<path d="M120 290L270 290" class="line"/>
<path d="M120 290L120 170" class="line"/>
<text x="255" y="320" font-size="20">e₀</text>
<text x="130" y="160" font-size="20">e₁</text>
<text x="530" y="90" font-size="22">After A = [[1,2],[0,1]]</text>
<path d="M570 290L720 290" class="line"/>
<path d="M570 290L810 170" class="line"/>
<text x="705" y="320" font-size="20">Ae₀</text>
<text x="815" y="160" font-size="20">Ae₁</text>
<text x="30" y="360" font-size="20">For any v, combine the transformed columns with the original coefficients.</text>
</svg>
