<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d"><title id="t">Tensor expansion</title><desc id="d">Read ac, ad, bc, bd in row-major order for labels 00,01,10,11.</desc><rect width="1000" height="380" fill="white"/><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#286a9b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#243746}.line{fill:none;stroke:#286a9b;stroke-width:2;marker-end:url(#a)}.guide{fill:none;stroke:#b4bfc8;stroke-width:1.5;stroke-dasharray:5 4}.box{fill:#f7f9fb;stroke:#c4cfd8}</style>
<text x="30" y="38" font-size="25">Every pair of subsystem labels contributes one coefficient</text>
<rect x="50" y="95" width="160" height="85" rx="5" class="box"/>
<text x="65" y="124" font-size="18">label 00</text>
<text x="110" y="159" font-size="24">ac</text>
<rect x="230" y="95" width="160" height="85" rx="5" class="box"/>
<text x="245" y="124" font-size="18">label 01</text>
<text x="290" y="159" font-size="24">ad</text>
<rect x="50" y="200" width="160" height="85" rx="5" class="box"/>
<text x="65" y="229" font-size="18">label 10</text>
<text x="110" y="264" font-size="24">bc</text>
<rect x="230" y="200" width="160" height="85" rx="5" class="box"/>
<text x="245" y="229" font-size="18">label 11</text>
<text x="290" y="264" font-size="24">bd</text>
<path d="M430 190L560 190" class="line"/>
<rect x="610" y="85" width="100" height="48" rx="5" class="box"/>
<text x="640" y="118" font-size="23">ac</text>
<text x="740" y="118" font-size="20">00</text>
<rect x="610" y="140" width="100" height="48" rx="5" class="box"/>
<text x="640" y="173" font-size="23">ad</text>
<text x="740" y="173" font-size="20">01</text>
<rect x="610" y="195" width="100" height="48" rx="5" class="box"/>
<text x="640" y="228" font-size="23">bc</text>
<text x="740" y="228" font-size="20">10</text>
<rect x="610" y="250" width="100" height="48" rx="5" class="box"/>
<text x="640" y="283" font-size="23">bd</text>
<text x="740" y="283" font-size="20">11</text>
<text x="30" y="350" font-size="20">Order: first subsystem label first. Swapping factors generally changes the array.</text>
</svg>
