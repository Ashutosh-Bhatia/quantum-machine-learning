<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="t d"><title id="t">A superposed parity query</title><desc id="d">Four coherent components are possible; one readout gives one record.</desc><rect width="1000" height="390" fill="white"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#286a9b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#243746}.box{fill:#f7f9fb;stroke:#c4cfd8}</style>
<text x="30" y="42" font-size="27">One statevector description, one record per shot</text>
<rect x="30" y="95" width="215" height="130" rx="5" class="box"/>
<text x="65" y="140" font-size="29">|000⟩</text>
<text x="50" y="190" font-size="23">amplitude 1/2</text>
<rect x="275" y="95" width="215" height="130" rx="5" class="box"/>
<text x="310" y="140" font-size="29">|011⟩</text>
<text x="295" y="190" font-size="23">amplitude 1/2</text>
<rect x="520" y="95" width="215" height="130" rx="5" class="box"/>
<text x="555" y="140" font-size="29">|101⟩</text>
<text x="540" y="190" font-size="23">amplitude 1/2</text>
<rect x="765" y="95" width="215" height="130" rx="5" class="box"/>
<text x="800" y="140" font-size="29">|110⟩</text>
<text x="785" y="190" font-size="23">amplitude 1/2</text>
<text x="35" y="285" font-size="22">Uniform input, parity f, target starts at zero: each joint probability is 1/4.</text>
<text x="35" y="350" font-size="23">A physical Z readout selects one label. It does not return the amplitude list.</text>
</svg>
