<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="t d"><title id="t">Phase kickback</title><desc id="d">Minus target stays unchanged while function-dependent signs appear on input amplitudes.</desc><rect width="1000" height="410" fill="white"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#286a9b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#243746}.box{fill:#f7f9fb;stroke:#c4cfd8}</style>
<text x="30" y="42" font-size="27">A conditional eigenvalue becomes a relative phase</text>
<rect x="35" y="95" width="420" height="150" rx="5" class="box"/>
<text x="55" y="140" font-size="28">Target: X|−⟩ = −|−⟩</text>
<text x="55" y="190" font-size="21">Input x receives (−1) raised to f(x)</text>
<text x="55" y="225" font-size="24">Target factors out as |−⟩</text>
<rect x="535" y="95" width="425" height="150" rx="5" class="box"/>
<text x="555" y="140" font-size="24">Parity input signs: +, −, −, +</text>
<text x="555" y="190" font-size="25">Input state: |−⟩ ⊗ |−⟩</text>
<text x="555" y="225" font-size="25">H ⊗ H sends it to |11⟩</text>
<text x="35" y="305" font-size="24">Before mixing: all four input Z probabilities are 1/4.</text>
<text x="35" y="365" font-size="21">After mixing: parity gives input label 11 with certainty. Other functions can differ.</text>
</svg>
