<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d"><title id="t">Signed interference sums</title><desc id="d">Equal branch signs reinforce zero; different signs reinforce one.</desc><rect width="1000" height="380" fill="white"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#286a9b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#243746}.box{fill:#f7f9fb;stroke:#c4cfd8}</style>
<text x="30" y="42" font-size="28">The property lives in a relative sign</text>
<rect x="35" y="90" width="430" height="220" rx="5" class="box"/>
<text x="55" y="135" font-size="27">Equal signs</text>
<text x="55" y="190" font-size="24">Zero: (1 + 1)/2 = 1</text>
<text x="55" y="235" font-size="24">One:  (1 − 1)/2 = 0</text>
<text x="55" y="285" font-size="23">Output 0: amplitude 1</text>
<rect x="535" y="90" width="430" height="220" rx="5" class="box"/>
<text x="555" y="135" font-size="27">Opposite signs</text>
<text x="555" y="190" font-size="24">Zero: (1 + -1)/2 = 0</text>
<text x="555" y="235" font-size="24">One:  (1 − -1)/2 = 1</text>
<text x="555" y="285" font-size="23">Output 1: amplitude 1</text>
<text x="35" y="355" font-size="21">A common negative sign changes amplitudes but preserves all outcome probabilities.</text>
</svg>
